 function seg(x,wd,y,fill,label,sub){ return '<rect x="'+x+'" y="'+y+'" width="'+wd+'" height="'+bh+'" fill="'+fill+'"/><text x="'+(x+12)+'" y="'+(y+28)+'" font-family="Host Grotesk,Arial,sans-serif" font-size="18" fill="'+(fill==='#EAEAEA'?'#000':'#fff')+'">'+label+'</text>'+(sub?'<text x="'+(x)+'" y="'+(y-10)+'" style="'+MONO+'" fill="#929292">'+sub+'</text>':''); }

function visHorizon(sel){
 var w=1200,h=110; var s='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Horizon strip from now to 2031">';
 s+='<line x1="40" y1="56" x2="1160" y2="56" stroke="#C7C7C7"/>';
 var xs=[40,320,600,880,1160], labels=["Now","Apr 27","Oct 27","Oct 28","2031"];
 xs.forEach(function(x,i){ var on=(i>0 && HORIZONS[i-1].id===sel); s+='<circle cx="'+x+'" cy="56" r="'+(on?10:5)+'" fill="'+(on?'#193A29':'#000')+'"/><text x="'+x+'" y="'+(on?30:34)+'" text-anchor="middle" style="'+MONO+'" fill="'+(on?'#000':'#929292')+'">'+labels[i]+'</text>'; if(on) s+='<text x="'+x+'" y="94" text-anchor="middle" font-family="Host Grotesk,Arial,sans-serif" font-size="15" fill="#000">'+HORIZONS[i-1].label+'</text>'; });
 return s+'</svg>';

function screens(){
 var order=ranked(); var top=order[0];
 var sel=SCENARIOS.filter(function(s){return s.id===(picked||top.id)})[0];
 var H=HORIZONS.filter(function(x){return x.id===horizon})[0];
 var fired=SIGNALS.filter(function(g){return live[g.id]}).length;
 return [
  {brand:true,html:'<p class="mono">Outside-in product read · Scale AI · October 2026 · not affiliated with Scale</p><h1>What if Scale sold proof, not projects?</h1><p class="lede">A reading of Scale’s roadmap from public sources, the futures that could change it and the one product that holds in all of them. Eight screens, five minutes.</p><p class="mono">Ahmad Abbasi · London</p>'},
  {html:'<p class="mono">01 · Where the roadmap points</p><h2>Eleven months of moves point one way</h2>'+visTimelineHtml()+'<p class="lede">The London product mandate says it plainly: “decide which custom solutions become core product.” (Scale job posting, June 2026)</p>'},
  {html:'<p class="mono">02 · The diagnosis</p><h2>Scale’s growth problem is a conversion problem</h2>'+visRevenueHtml()+'<p class="note">Reported estimates, not Scale disclosures: Forbes (May 2026) for revenue and the Meta terms; Scale’s own January 2026 letter for the applications figure and the 18-month target, restated by the new CEO in July.</p><div class="cols"><div><h3>Deployments don’t add up to a product</h3><p>Gartner (29 Sep 2026) says under 20% of vendor forward-deployed engagements turn recurring needs into product and expects 70% of enterprises to abandon agentic AI built that way by 2028. Scale’s own board, as of October 2026: 32 open roles in customer solutions, 9 in product.</p></div><div><h3>The Meta floor hides it</h3><p>Nearly half of revenue is contracted. Applications must more than double just to make the 18-month target.</p></div></div>'},
  {html:'<p class="mono">03 · The asset</p><h2>Scale is the one vendor that both ships agents and runs the evaluations the labs cite</h2>'+visRefereeHtml()+'<p class="lede">450-plus evaluations across 50-plus model releases in 2025 (Scale’s January 2026 letter). Data, evaluation and post-training under one roof. The catch is in the third box: neutrality is only credible if Meta’s 49% is walled off from the referee, which is why screen 05 treats that as the live risk rather than a given.</p>'},
  {html:'<p class="mono">04 · The proposal</p><h2>Scale Proof + Playbooks</h2><div class="grid3"><div><h3>Proof</h3><p>A certified Deployment Profile per workflow: reliability, oversight needed, cost per decision. Sold for any agent on any stack.</p></div><div><h3>Playbooks</h3><p>The four builds the field keeps repeating, packaged: eval harness, post-training recipe, deployment template. Priced per outcome.</p></div><div><h3>Why both</h3><p>Proof opens the door and is the moat. Playbooks monetise what Proof certifies. Dialect makes each one compound.</p></div></div>'+visCycleHtml()+'<p class="note">Built for the “neutral referee” future, which on its own I rate least likely. Screens 05 to 07 are how it still pays in the others.</p>'},
  {html:'<p class="mono">05 · Choose a future</p><h2>A roadmap is a bet on one future. Tap one and the next screen rewrites around it.</h2><p class="note">My estimates as of October 2026, from public sources. The futures overlap, so they don’t add to 100.'+(fired?' '+fired+' of the indicators behind them '+(fired>1?'have':'has')+' already fired.':'')+'</p><div class="choices">'+order.map(function(s){ return '<button class="choice'+(picked&&s.id===picked?' on':'')+'" data-pick="'+s.id+'"><span class="name">'+esc(s.name)+'</span><span class="bar"><i style="width:'+score(s)+'%"></i></span><span class="mono">'+score(s)+'% likely</span></button>'; }).join('')+'</div>'},
  {html:'<p class="mono">06 · If this is the future · '+score(sel)+'% likely</p><h2>'+esc(sel.name)+'</h2><p class="lede">'+esc(sel.summary)+'</p><div class="chiplbl"><span class="mono">Horizon</span><div class="chips">'+HORIZONS.map(function(x){return '<button data-h="'+x.id+'" class="'+(x.id===horizon?'on':'')+'">'+x.label+' · '+esc(x.to)+'</button>'}).join('')+'</div></div>'+rows([["By "+H.to,sel.h[horizon]],["Scale’s move",sel.move],["The proposal flexes",sel.flex],["We’d be wrong if",sel.wrong]])},
  {html:'<p class="mono">07 · What holds in every future</p><h2>Six moves that win whichever future arrives</h2><div class="grid3">'+NOREGRET.map(function(n,i){return '<div><span class="mono">'+pad(i+1)+'</span><h3>'+esc(n[0])+'</h3><p>'+esc(n[1])+'</p></div>'}).join('')+'</div><p class="lede">Labs can out-deploy Scale. Clouds can out-distribute it. Neither can credibly certify the agents they sell. Scale can, if it ring-fences the referee first.</p>'},
  {brand:true,html:'<p class="mono">08 · The ask</p><h1>Twenty minutes with someone who ships this.</h1><p class="lede">Not a pitch. I want to find out where this reading is right, where it is wrong and what I could not see from the outside.</p><div class="grid3" style="background:transparent;border:0;gap:24px"><div style="background:transparent;padding:0"><span class="mono">I want to test</span><h3>Is custom-to-core the real bottleneck?</h3><p style="opacity:.85">The London mandate says so. Does the field agree, and what has already crossed over?</p></div><div style="background:transparent;padding:0"><span class="mono">I want to test</span><h3>Would Scale sell the certificate on a rival’s agent?</h3><p style="opacity:.85">Proof only works if the answer is yes. If it is no, the referee future is closed and the plan changes.</p></div><div style="background:transparent;padding:0"><span class="mono">I want to test</span><h3>Which future do you expect?</h3><p style="opacity:.85">Screen 05 is my bet. Yours is the one I can’t make from outside.</p></div></div><p class="lede">What you get: an outside read of your own roadmap, sourced, that you can argue with in twenty minutes. What I get: the chance to be wrong in front of people who do this for a living.</p><p class="mono">Ahmad Abbasi · London</p><details><summary class="mono" style="cursor:pointer">Sources</summary><div class="src" style="margin-top:12px;opacity:.8">'+SOURCES.map(function(s){return '<p>'+esc(s)+'</p>'}).join('')+'</div></details>'}
 ];
}

function render(){
 var app=document.getElementById("app");
 var S=screens(); var s=S[screen];
 var logo=recorded.logo?'<img src="'+esc(recorded.logo)+'" alt="">':'<span class="mono">Outside read · not affiliated with Scale AI</span>';
 var html='<div class="top"><div class="brand">'+logo+'</div><span class="mono">'+(screen===0?'':pad(screen)+' / '+pad(N-1))+'</span></div><div class="progress"><i style="width:'+Math.round((screen/(N-1))*100)+'%"></i></div>';
 html+= s.brand?'<section class="screen brandbg"><div class="inner">'+s.html+'</div></section>':'<section class="screen">'+s.html+'</section>';
 html+='<div class="nav"><button data-nav="-1"'+(screen===0?' disabled':'')+'>Previous</button><span class="mono">'+(screen===5?'Tap a future':(screen===N-1?'End':''))+'</span><button data-nav="1" class="primary"'+(screen===N-1?' disabled':'')+'>Next</button></div>';
 if(AUTHOR) html+='<details id="owner" style="padding-block:8px 40px"><summary class="mono" style="cursor:pointer">Update indicators (for the author)</summary><div style="padding-top:12px;max-width:760px"><p class="note">Tick what has actually happened; likelihoods on screen 05 re-sort. On the hosted copy, send the ticked list to be republished.</p>'
  +SIGNALS.map(function(g){ var sup=Object.keys(g.supports).filter(function(k){return g.supports[k]>0}).map(function(k){return SCENARIOS.filter(function(x){return x.id===k})[0].name}).join(', '); return '<div class="sig"><input type="checkbox" id="sig-'+g.id+'" data-sig="'+g.id+'"'+(live[g.id]?' checked':'')+'><label for="sig-'+g.id+'">'+esc(g.text)+'<span class="mono">Supports: '+esc(sup)+'</span></label></div>'; }).join('')
  +'<div class="rowbtns" style="margin-top:16px"><button data-act="reset">Reset to recorded</button><button data-act="clear">Clear all</button>'+(artifactCap?'<button data-act="publish" class="primary">Record for everyone</button>':'')+'<span class="note">'+esc(toast||('Recorded '+(recorded.updatedAt||'')+(dirty?' · unrecorded changes':'')))+'</span></div></div></details>';
 app.innerHTML=html;
 var own=document.getElementById('owner'); if(own){ if(ownerOpen) own.open=true; own.addEventListener('toggle',function(){ ownerOpen=own.open; }); }
 app.querySelectorAll('button[data-nav]').forEach(function(b){ b.addEventListener('click',function(){ go(screen+(+b.getAttribute('data-nav'))); }); });
 app.querySelectorAll('button[data-pick]').forEach(function(b){ b.addEventListener('click',function(){ picked=b.getAttribute('data-pick'); go(6); }); });
 app.querySelectorAll('button[data-h]').forEach(function(b){ b.addEventListener('click',function(){ horizon=b.getAttribute('data-h'); render(); }); });
 app.querySelectorAll('input[data-sig]').forEach(function(c){ c.addEventListener('change',function(){ var id=c.getAttribute('data-sig'); if(c.checked) live[id]=true; else delete live[id]; dirty=true; toast=""; render(); }); });
 app.querySelectorAll('button[data-act]').forEach(function(b){ b.addEventListener('click',function(){ var a=b.getAttribute('data-act'); if(a==='reset'){ live=JSON.parse(JSON.stringify(recorded.signals)); dirty=false; toast=""; render(); } else if(a==='clear'){ live={}; dirty=true; toast=""; render(); } else if(a==='publish'){ publish(); } }); });
}
function go(n){ screen=Math.max(0,Math.min(N-1,n)); try{ history.replaceState(null,'','#s'+screen); }catch(e){} window.scrollTo(0,0); render(); }
document.addEventListener('keydown',function(e){ if(e.target&&/INPUT|TEXTAREA|SUMMARY/.test(e.target.tagName)) return; if(e.key==='ArrowRight') go(screen+1); if(e.key==='ArrowLeft') go(screen-1); });

function buildDocument(state){
 var headStyle=document.head.querySelector('style');
 var reset=headStyle?headStyle.textContent:':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
 var css=document.getElementById('css').textContent; var link=document.querySelector('link[rel="stylesheet"]'); var js=document.getElementById('appjs').textContent;
 var json=JSON.stringify(state).replace(/<\//g,'<\\/'); var SC='</scr'+'ipt>';
 return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body><title>'+TITLE+'</title><meta name="claude:viewport-fit-sides" content="cover">'+(link?'<link rel="stylesheet" href="'+link.getAttribute('href')+'">':'')+'<style id="css">'+css+'</style><div id="app" class="frame"></div><script id="state" type="application/json">'+json+SC+'<script id="appjs">'+js+SC+'</body></html>';
}
function publish(){
 if(!artifactCap) return;
 var d=new Date(); var iso=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
 var state={signals:live,updatedAt:iso,logo:recorded.logo||""};
 toast="Recording…"; render();
 artifactCap.publish(buildDocument(state)).then(function(){ recorded=state; dirty=false; toast="Recorded. Everyone with the link now sees this."; render(); })
 .catch(function(e){ var c=e&&e.code; toast=(c==='not_granted'||c==='not_writer')?"Only the owner can record. Your changes stay on this screen.":(c==='conflict'?"Someone else recorded first; reloading to their version.":"Could not record ("+(c||"error")+")."); render(); });
}
render();
if(window.claude&&typeof window.claude.use==='function'){ window.claude.use('artifact').then(function(cap){ artifactCap=cap||null; render(); }).catch(function(){}); }
})();
</script>
